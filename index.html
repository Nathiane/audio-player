<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8fb1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>My Playlist</title>
<style>
:root{
  --pink:#ff8fb1;
  --pink-dark:#f4688f;
  --pink-deep:#e14e78;
  --pink-soft:#fff6f9;
  --pink-line:#ffd8e4;
  --ink:#3a3338;
}
*{box-sizing:border-box}

body{
  font-family:system-ui,"HarmonyOS Sans",sans-serif;
  margin:0 auto;max-width:1180px;
  padding:clamp(18px,3.2vw,40px) clamp(16px,3.6vw,48px) clamp(32px,5vw,64px);
  background:#ffffff;color:var(--ink);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ================= 顶部工具栏 ================= */
#bar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:16px 18px;margin-bottom:18px;
  background:#fff;border:1.5px solid var(--pink-line);
  border-radius:18px;
  box-shadow:0 6px 24px rgba(255,143,177,.14);
}
#bar label{font-size:14px;display:flex;align-items:center;gap:7px;color:var(--ink)}
#bar .wide input[type=range]{flex:1;width:auto;min-width:80px}

/* ================= 按钮 ================= */
button{
  padding:10px 18px;font-size:14px;font-weight:600;
  border-radius:999px;border:1.5px solid var(--pink-line);
  background:#fff;color:var(--pink-dark);
  cursor:pointer;transition:all .16s ease;
  font-family:inherit;letter-spacing:.2px;
}
button:hover{background:var(--pink-soft);border-color:var(--pink)}
button:active{transform:scale(.96)}
button.main{
  background:var(--pink);border-color:var(--pink);color:#fff;
  box-shadow:0 6px 18px rgba(255,143,177,.5);
}
button.main:hover{background:var(--pink-dark);border-color:var(--pink-dark)}

#lockall.on{background:var(--pink);border-color:var(--pink);color:#fff}
#lockall.on:hover{background:var(--pink-dark);border-color:var(--pink-dark)}

.pbtn,.lk,.dl{
  width:38px;height:38px;min-width:38px;padding:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:#fff;border:1.5px solid var(--pink-line);
  color:var(--pink-dark);
  transition:all .16s ease;flex:none;
}
.lk,.dl{width:34px;height:34px;min-width:34px}
.pbtn svg,.lk svg,.dl svg{display:block}

.pbtn:hover{background:var(--pink);border-color:var(--pink);color:#fff;
  transform:scale(1.07);box-shadow:0 3px 10px rgba(255,143,177,.45)}
.pbtn:active{transform:scale(.94)}

.lk.on{background:var(--pink);border-color:var(--pink);color:#fff}
.lk:hover{background:var(--pink-soft)}
.lk.on:hover{background:var(--pink-dark);border-color:var(--pink-dark)}

.dl:hover{background:#fff0f2;border-color:#ffb3c2;color:#ec3f6a}
.dl:active{transform:scale(.92)}

button.q5{
  padding:6px 9px;font-size:12px;font-weight:700;line-height:1;
  min-width:46px;border-radius:999px;
  background:#fff;color:var(--pink-dark);
  border:1.5px solid var(--pink-line);flex:none;
}
button.q5:hover{background:var(--pink-soft);border-color:var(--pink)}

/* ================= 拖拽区 ================= */
#drop{
  border:2px dashed var(--pink-line);border-radius:18px;
  padding:clamp(22px,3vw,34px);text-align:center;
  color:var(--pink-dark);font-size:14px;
  background:var(--pink-soft);
  margin-bottom:18px;
}

/* ================= 列表 ================= */
#list{margin-top:4px}

.row{
  display:grid;
  grid-template-columns:22px minmax(0,1fr) 38px 132px 50px 46px 34px 34px;
  gap:12px;align-items:center;
  padding:12px 14px;
  border-bottom:1px solid #fdeef3;
  border-radius:12px;
  transition:background .12s;
}
.row:hover{background:var(--pink-soft)}

.name{
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-size:14.5px;color:var(--ink);
}

input[type=checkbox]{
  accent-color:var(--pink);
  width:18px;height:18px;cursor:pointer;flex:none;
}

input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:132px;height:8px;border-radius:999px;
  background:#f3f0f1;outline:none;cursor:pointer;flex:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:19px;height:19px;border-radius:50%;
  background:#fff;border:3px solid var(--pink);cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:#fff;border:3px solid var(--pink);cursor:pointer;
}
input[type=range]:disabled{cursor:not-allowed}

.vn{
  width:48px;text-align:right;font-size:12.5px;font-weight:700;
  color:var(--pink-dark);font-family:ui-monospace,Consolas,monospace;
  cursor:pointer;flex:none;
}
.vn:hover{color:var(--pink-deep);text-decoration:underline}

#msg{font-size:13px;color:var(--pink-dark);font-weight:600}

/* ================= 导出/导入折叠区 ================= */
#ioBox{display:none;margin-top:18px}
#ioBox.show{display:block}

textarea{
  width:100%;height:92px;
  background:#fff;color:var(--ink);
  border:1.5px solid var(--pink-line);border-radius:14px;
  padding:12px;font-size:12px;font-family:ui-monospace,Consolas,monospace;
  resize:vertical;
}
textarea:focus{outline:none;border-color:var(--pink)}
::placeholder{color:#d9c5cd}

/* ================= 返回顶部 ================= */
#topBtn{
  position:fixed;right:24px;bottom:28px;z-index:900;
  width:48px;height:48px;min-width:48px;padding:0;
  display:none;align-items:center;justify-content:center;
  border-radius:50%;
  background:var(--pink);border:1.5px solid var(--pink);color:#fff;
  box-shadow:0 8px 24px rgba(255,143,177,.5);
}
#topBtn.show{display:flex}
#topBtn:hover{background:var(--pink-dark);border-color:var(--pink-dark);transform:scale(1.06)}

/* ================= 进门提问 ================= */
#gate{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:linear-gradient(160deg,#ffd9e6 0%,#fff6f9 55%,#ffe9f1 100%);
}
#gate.hide{display:none}
.gate-card{
  width:100%;max-width:430px;
  background:#fff;border:1.5px solid var(--pink-line);
  border-radius:26px;padding:30px 26px;
  box-shadow:0 18px 50px rgba(255,143,177,.35);
  text-align:center;
}
.gate-card h2{
  font-size:19px;margin:0 0 6px;color:var(--ink);
  line-height:1.55;font-weight:700;
}
.gate-sub{font-size:12.5px;color:#b39aa4;margin-bottom:20px}
#gateIn{
  width:100%;padding:14px 16px;font-size:16px;
  border:1.5px solid var(--pink-line);border-radius:14px;
  background:#fff;color:var(--ink);text-align:center;
  font-family:inherit;
}
#gateIn:focus{outline:none;border-color:var(--pink);
  box-shadow:0 0 0 4px rgba(255,143,177,.18)}
#gateBtn{
  width:100%;margin-top:14px;padding:14px;font-size:16px;
  background:var(--pink);border-color:var(--pink);color:#fff;
  box-shadow:0 8px 22px rgba(255,143,177,.5);
}
#gateMsg{
  margin-top:16px;font-size:14px;font-weight:700;
  color:var(--pink-deep);min-height:22px;line-height:1.6;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}
.shake{animation:shake .42s ease}

/* ================= 手机适配 ================= */
@media (max-width:620px){
  #bar{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:8px;padding:12px;border-radius:16px;
  }
  #bar button{width:100%;padding:10px 4px;font-size:13px}
  #pick{grid-column:1 / -1}
  #bar label{grid-column:1 / -1;font-size:13.5px;gap:8px}
  #msg{grid-column:1 / -1;text-align:center}

  .row{
    grid-template-columns:auto minmax(0,1fr) auto auto auto;
    grid-template-areas:
      "cb nm dl dl dl"
      "pb vo vn q5 lk";
    gap:9px 8px;padding:12px 10px;
  }
  .cb{grid-area:cb}
  .nm{grid-area:nm}
  .pb{grid-area:pb}
  .vo{grid-area:vo}
  .vn{grid-area:vn}
  .q5{grid-area:q5}
  .lk{grid-area:lk;justify-self:end}
  .dl{grid-area:dl;justify-self:end}

  .name{
    white-space:normal;word-break:break-all;line-height:1.38;font-size:14px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }
  #list .row input[type=range]{width:100%;min-width:0}
  .vn{width:44px;font-size:12px}
  button.q5{min-width:42px;padding:6px 7px;font-size:11.5px}

  #topBtn{right:16px;bottom:18px;width:46px;height:46px;min-width:46px}
  .gate-card{padding:26px 20px}
}
</style>
</head>
<body>

<!-- ================= 进门提问 ================= -->
<div id="gate">
  <div class="gate-card">
    <h2>我是不是全世界最棒的宝宝！</h2>
    <div class="gate-sub">回答「是」或「当然」即可进入</div>
    <input id="gateIn" type="text" placeholder="在这里回答…" autocomplete="off">
    <button id="gateBtn">确定</button>
    <div id="gateMsg"></div>
  </div>
</div>

<div id="bar">
  <button id="pick" class="main">选择文件</button>
  <button id="play">▶ 播放选中</button>
  <button id="stop">■ 全部停止</button>
  <button id="reset">↺ 恢复 25%</button>
  <button id="lockall">🔒 全部锁定</button>
  <button id="exp">导出</button>
  <button id="imp">导入</button>
  <label class="wide"><input type="checkbox" id="loop" checked> 循环播放</label>
  <label class="wide">
    总音量 <input id="master" type="range" min="0" max="1" step="0.01" value="1">
    <span class="vn" id="mv">100%</span>
  </label>
  <span id="msg"></span>
</div>

<div id="drop">把音频文件拖到这里也可以</div>
<div id="list"></div>

<div id="ioBox">
  <textarea id="cfg" placeholder="设置文本会出现在这里（导出/导入用）"></textarea>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button id="ioHide">收起</button>
  </div>
</div>

<input type="file" id="f" multiple accept="audio/*" hidden>

<button id="topBtn" title="回到顶部">
  <svg viewBox="0 0 24 24" width="18" height="18">
    <path d="M12 19.5V6M6 12l6-6 6 6" stroke="currentColor" stroke-width="2.2"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<script>
var KEY      = "multiAudio.v5";
var DEF      = 0.25;      /* 默认音量 25% */
var QUICK    = 0.05;      /* 「5%」快捷按钮 */
var ASK_ON_START = true;  /* 进门提问开关，false 就不问了 */

var tracks = [];
var $ = function(id){ return document.getElementById(id); };

var ICON_PLAY  = '<svg viewBox="0 0 24 24" width="15" height="15"><polygon points="8,5 20,12 8,19" fill="currentColor"/></svg>';
var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="15" height="15"><rect x="7" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/></svg>';
var ICON_LOCK  = '<svg viewBox="0 0 24 24" width="13" height="13"><rect x="5" y="10.5" width="14" height="9.5" rx="2.6" fill="currentColor"/><path d="M8.6 10.5V7.6a3.4 3.4 0 0 1 6.8 0v2.9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';
var ICON_OPEN  = '<svg viewBox="0 0 24 24" width="13" height="13"><rect x="5" y="10.5" width="14" height="9.5" rx="2.6" fill="currentColor" opacity=".35"/><path d="M8.6 10.5V7.6a3.4 3.4 0 0 1 6.5-1.2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';
var ICON_TRASH = '<svg viewBox="0 0 24 24" width="14" height="14"><path d="M4.5 7h15M9.5 7V5.2h5V7M6.8 7l.9 12.2h8.6L17.2 7" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function loadCfg(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
function saveCfg(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }

function paint(el){
  var p = Math.round(el.value * 100);
  el.style.background = "linear-gradient(to right,#ff8fb1 " + p + "%,#f3f0f1 " + p + "%)";
}

function syncLockAll(){
  var btn = $("lockall");
  if (!tracks.length) { btn.classList.remove("on"); btn.textContent = "🔒 全部锁定"; return; }
  var all = true;
  for (var i = 0; i < tracks.length; i++) { if (!tracks[i].v.disabled) { all = false; break; } }
  btn.classList.toggle("on", all);
  btn.textContent = all ? "🔓 全部解锁" : "🔒 全部锁定";
}

/* ================= 进门提问 ================= */
var ANSWERS = ["是", "当然", "当然是", "你当然是"];

function gatePass(){
  var v = (($("gateIn").value || "") + "")
    .replace(/[\s\u3000，。！!？?~～.、,]/g, "");
  for (var i = 0; i < ANSWERS.length; i++) {
    if (v === ANSWERS[i]) return true;
  }
  return false;
}

$("gateBtn").onclick = function(){
  if (gatePass()) {
    $("gate").classList.add("hide");
    $("gateMsg").textContent = "";
  } else {
    $("gateMsg").textContent = "你等着，我这就顺着网线过来找你 🔌";
    var card = document.querySelector(".gate-card");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
    $("gateIn").value = "";
    $("gateIn").focus();
  }
};
$("gateIn").addEventListener("keydown", function(e){
  if (e.key === "Enter") $("gateBtn").click();
});

if (!ASK_ON_START) $("gate").classList.add("hide");

/* ================= 防误刷新 ================= */
window.addEventListener("beforeunload", function(e){
  if (tracks.length > 0) {
    e.preventDefault();
    e.returnValue = "列表里还有音频，确定要离开吗？";
    return e.returnValue;
  }
});

/* ================= 返回顶部 ================= */
window.addEventListener("scroll", function(){
  $("topBtn").classList.toggle("show", window.scrollY > 260);
}, { passive: true });

$("topBtn").onclick = function(){
  try { window.scrollTo({ top: 0, behavior: "smooth" }); }
  catch(err){ window.scrollTo(0, 0); }
};

/* ================= 导出/导入折叠 ================= */
function openIO(){
  $("ioBox").classList.add("show");
}
$("ioHide").onclick = function(){
  $("ioBox").classList.remove("show");
};

/* ================= 添加文件 ================= */
function addFiles(fs){
  var cfg = loadCfg();
  for (var i = 0; i < fs.length; i++) {
    (function(file){
      var id = file.name + "|" + file.size;
      for (var k = 0; k < tracks.length; k++) { if (tracks[k].id === id) return; }

      var url = URL.createObjectURL(file);
      var row = document.createElement("div"); row.className = "row";

      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = true; cb.className = "cb";

      var nm = document.createElement("span");
      nm.className = "name nm"; nm.textContent = file.name; nm.title = file.name;

      var bt = document.createElement("button");
      bt.className = "pbtn pb"; bt.title = "单独试听"; bt.innerHTML = ICON_PLAY;

      var vo = document.createElement("input");
      vo.type = "range"; vo.min = 0; vo.max = 1; vo.step = 0.01; vo.className = "vo";
      vo.value = (cfg.vol && cfg.vol[id] !== undefined) ? cfg.vol[id] : DEF;

      var vn = document.createElement("span");
      vn.className = "vn"; vn.textContent = Math.round(vo.value * 100) + "%";
      vn.title = "点这里可以直接输入数值";
      paint(vo);

      var q5 = document.createElement("button");
      q5.className = "q5"; q5.textContent = Math.round(QUICK * 100) + "%";
      q5.title = "一键设为 " + Math.round(QUICK * 100) + "%";

      var lk = document.createElement("button");
      lk.className = "lk"; lk.title = "锁定这一条的音量";

      var dl = document.createElement("button");
      dl.className = "dl"; dl.title = "从列表里删除"; dl.innerHTML = ICON_TRASH;

      var au = new Audio(url);
      au.loop = $("loop").checked;
      au.volume = Math.min(1, vo.value * $("master").value);

      var rec = { id:id, c:cb, a:au, v:vo, n:vn, l:lk, url:url };

      vo.oninput = function(){
        au.volume = Math.min(1, vo.value * $("master").value);
        vn.textContent = Math.round(vo.value * 100) + "%";
        paint(vo);
        var c = loadCfg(); c.vol = c.vol || {};
        c.vol[id] = parseFloat(vo.value); saveCfg(c);
      };

      vn.onclick = function(){
        if (vo.disabled) return;
        var s = prompt("输入音量（0-100）", Math.round(vo.value * 100));
        if (s === null) return;
        var n = parseFloat(s);
        if (isNaN(n)) return;
        vo.value = Math.max(0, Math.min(100, n)) / 100;
        vo.oninput();
      };

      q5.onclick = function(){
        if (vo.disabled) return;
        vo.value = QUICK;
        vo.oninput();
      };

      function setLock(on){
        vo.disabled = on;
        vo.style.opacity = on ? .45 : 1;
        vn.style.opacity = on ? .45 : 1;
        vn.style.pointerEvents = on ? "none" : "auto";
        q5.style.opacity = on ? .4 : 1;
        q5.style.pointerEvents = on ? "none" : "auto";
        lk.innerHTML = on ? ICON_LOCK : ICON_OPEN;
        lk.classList.toggle("on", on);
        var c = loadCfg(); c.lock = c.lock || {}; c.lock[id] = !!on; saveCfg(c);
        syncLockAll();
      }
      rec.setLock = setLock;
      lk.onclick = function(){ setLock(!vo.disabled); };
      setLock(!!(cfg.lock && cfg.lock[id]));

      dl.onclick = function(){
        if (!confirm("把这个音频从列表里移除？\n" + file.name)) return;
        au.pause(); au.removeAttribute("src");
        try { URL.revokeObjectURL(url); } catch(e){}
        if (row.parentNode) row.parentNode.removeChild(row);
        for (var z = 0; z < tracks.length; z++) {
          if (tracks[z] === rec) { tracks.splice(z, 1); break; }
        }
        $("msg").textContent = "剩余 " + tracks.length + " 个";
        syncLockAll();
      };

      bt.onclick = function(){ if (au.paused) { au.play(); } else { au.pause(); } };
      au.onplay  = function(){ bt.innerHTML = ICON_PAUSE; };
      au.onpause = function(){ bt.innerHTML = ICON_PLAY; };
      au.onerror = function(){ nm.textContent = file.name + "（无法播放）"; };

      row.appendChild(cb); row.appendChild(nm); row.appendChild(bt);
      row.appendChild(vo); row.appendChild(vn); row.appendChild(q5);
      row.appendChild(lk); row.appendChild(dl);
      $("list").appendChild(row);
      tracks.push(rec);
    })(fs[i]);
  }
  $("msg").textContent = "共 " + tracks.length + " 个";
  syncLockAll();
}

$("pick").onclick = function(){ $("f").click(); };
$("f").onchange = function(e){ addFiles(e.target.files); e.target.value = ""; };

var drop = $("drop");
drop.ondragover = function(e){ e.preventDefault(); };
drop.ondrop = function(e){
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
};

$("play").onclick = function(){
  for (var i = 0; i < tracks.length; i++) {
    if (tracks[i].c.checked) { try { tracks[i].a.play(); } catch(err){} }
  }
};
$("stop").onclick = function(){
  for (var i = 0; i < tracks.length; i++) {
    tracks[i].a.pause(); tracks[i].a.currentTime = 0;
  }
};

$("reset").onclick = function(){
  var c = loadCfg(); c.vol = c.vol || {};
  var n = 0;
  for (var i = 0; i < tracks.length; i++) {
    var t = tracks[i];
    if (t.v.disabled) continue;
    t.v.value = DEF;
    t.n.textContent = Math.round(DEF * 100) + "%";
    paint(t.v);
    t.a.volume = Math.min(1, DEF * $("master").value);
    c.vol[t.id] = DEF;
    n++;
  }
  saveCfg(c);
  $("msg").textContent = "已恢复 " + n + " 条到 " + Math.round(DEF * 100) + "%（锁定的不动）";
};

$("lockall").onclick = function(){
  if (!tracks.length) { $("msg").textContent = "还没有音频"; return; }
  var all = true;
  for (var i = 0; i < tracks.length; i++) { if (!tracks[i].v.disabled) { all = false; break; } }
  var target = !all;
  for (var j = 0; j < tracks.length; j++) tracks[j].setLock(target);
  syncLockAll();
  $("msg").textContent = target ? "已全部锁定" : "已全部解锁";
};

$("loop").onchange = function(){
  var v = this.checked;
  for (var i = 0; i < tracks.length; i++) tracks[i].a.loop = v;
};

$("master").oninput = function(){
  var m = this.value;
  $("mv").textContent = Math.round(m * 100) + "%";
  paint($("master"));
  for (var i = 0; i < tracks.length; i++)
    tracks[i].a.volume = Math.min(1, tracks[i].v.value * m);
};
$("mv").onclick = function(){
  var s = prompt("输入总音量（0-100）", Math.round($("master").value * 100));
  if (s === null) return;
  var n = parseFloat(s);
  if (isNaN(n)) return;
  $("master").value = Math.max(0, Math.min(100, n)) / 100;
  $("master").oninput();
};

/* 导出：自动展开并填入 */
$("exp").onclick = function(){
  var o = { vol:{}, lock:{} };
  for (var i = 0; i < tracks.length; i++) {
    o.vol[tracks[i].id] = parseFloat(tracks[i].v.value);
    if (tracks[i].v.disabled) o.lock[tracks[i].id] = true;
  }
  saveCfg(o);
  var t = JSON.stringify(o);
  openIO();
  $("cfg").value = t;
  try { navigator.clipboard.writeText(t); $("msg").textContent = "已导出并复制"; }
  catch(e){ $("msg").textContent = "已导出，请手动复制"; }
};

/* 导入：第一次点先展开 */
$("imp").onclick = function(){
  if (!$("ioBox").classList.contains("show")) {
    openIO();
    $("cfg").focus();
    $("msg").textContent = "把设置文本粘贴进去，再点一次「导入」";
    return;
  }
  try {
    var o = JSON.parse($("cfg").value);
    saveCfg(o);
    for (var i = 0; i < tracks.length; i++) {
      var t = tracks[i];
      if (o.vol && o.vol[t.id] !== undefined && !t.v.disabled) {
        t.v.value = o.vol[t.id];
        t.n.textContent = Math.round(t.v.value * 100) + "%";
        paint(t.v);
        t.a.volume = Math.min(1, t.v.value * $("master").value);
      }
    }
    $("msg").textContent = "已导入";
  } catch(e){ $("msg").textContent = "导入失败：文本格式不对"; }
};

paint($("master"));
syncLockAll();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
